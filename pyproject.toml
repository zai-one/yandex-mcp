[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "zai-yandex-mcp"
version = "0.1.0.dev0"
description = "Standalone governed Yandex MCP service"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastmcp==3.4.4",
  "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.15.21"]

[tool.hatch.build.targets.wheel]
packages = ["src/zai_yandex"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
